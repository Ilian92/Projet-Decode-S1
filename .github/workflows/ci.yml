name: "CI - DEV"

on:
  push:
    branches:
      - dev

jobs:
  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projet-s1-symfony
    steps:
      - uses: actions/checkout@v5
      - name: "Show variables"
        run: |
          echo "OS: $RUNNER_OS"
          echo "ARCH: $RUNNER_ARCH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.composer
            ~/.cache
          key: ${{ runner.os }}-${{ runner.arch }}-vendor-cache
      - uses: actions/cache@v4
        with:
          path: ./projet-s1-symfony/vendor
          key: ${{ runner.os }}-${{ runner.arch }}-vendor-${{ hashFiles('**/composer.lock') }}
      - run: composer install

  lint:
    needs: ["prepare"]
    name: "Lint code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./vendor
          key: ${{ runner.os }}-${{ runner.arch }}-vendor-${{ hashFiles('**/composer.lock') }}

      # utiliser le bon linter quand choisi et installé
      - name: Run PHPStan
        run: |
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse || exit 1
          else
            echo "phpstan not available, skipping"
          fi
  unit-tests:
    needs: ["prepare"]
    name: "Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projet-s1-symfony
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./projet-s1-symfony/vendor
          key: ${{ runner.os }}-${{ runner.arch }}-vendor-${{ hashFiles('**/composer.lock') }}

      - name: Create .env.test.local
        run: |
          printf 'APP_ENV=test\nAPP_SECRET=test_secret\nCART_HMAC_SECRET=test-secret-key\nDATABASE_URL=sqlite:///%%kernel.project_dir%%/var/data_test.db\n' > .env.test.local

      - name: Run unit tests (Entity + Service)
        run: |
          mkdir -p var
          php bin/phpunit tests/Entity tests/Service --testdox --log-junit var/phpunit-unit.xml

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: projet-s1-symfony/var/phpunit-unit.xml
          check_name: "Unit test results"

  functional-tests:
    needs: ["prepare"]
    name: "Functional tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projet-s1-symfony
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./projet-s1-symfony/vendor
          key: ${{ runner.os }}-${{ runner.arch }}-vendor-${{ hashFiles('**/composer.lock') }}

      - name: Create .env.test.local
        run: |
          printf 'APP_ENV=test\nAPP_SECRET=test_secret\nCART_HMAC_SECRET=test-secret-key\nDATABASE_URL=postgresql://app:!ChangeMe!@127.0.0.1:5432/app_test?serverVersion=16\n' > .env.test.local

      - name: Create database and run migrations
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run functional tests (Controller)
        run: |
          mkdir -p var
          php bin/phpunit tests/Controller --testdox --log-junit var/phpunit-functional.xml

      - name: Publish functional test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: projet-s1-symfony/var/phpunit-functional.xml
          check_name: "Functional test results"

  e2e-tests:
    needs: ["prepare"]
    name: "E2E tests (Cypress)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Restore vendor cache
        uses: actions/cache/restore@v4
        with:
          path: ./projet-s1-symfony/vendor
          key: ${{ runner.os }}-${{ runner.arch }}-vendor-${{ hashFiles('**/composer.lock') }}

      - name: Install npm dependencies
        working-directory: ./projet-s1-symfony
        run: npm ci

      - name: Create .env.test.local
        working-directory: ./projet-s1-symfony
        run: |
          printf 'APP_ENV=test\nAPP_SECRET=test_secret\nCART_HMAC_SECRET=test-secret-key\nDATABASE_URL=postgresql://app:!ChangeMe!@127.0.0.1:5432/app_test?serverVersion=16\nMAILER_DSN=null://null\nSTRIPE_SECRET_KEY=sk_test_dummy\nSTRIPE_WEBHOOK_SECRET=whsec_dummy\n' > .env.test.local

      - name: Create database, run migrations and load fixtures
        working-directory: ./projet-s1-symfony
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Build assets
        working-directory: ./projet-s1-symfony
        run: npm run build

      - name: Start Symfony server
        working-directory: ./projet-s1-symfony
        run: php -S 0.0.0.0:8000 -t public &

      - name: Wait for server to be ready
        run: |
          until curl -s http://localhost:8000 > /dev/null; do
            echo "Waiting for server..."
            sleep 2
          done

      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./projet-s1-symfony
          browser: chrome
          spec: cypress/e2e/registerLogin.cy.js,cypress/e2e/searchBook.cy.js

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: projet-s1-symfony/cypress/screenshots

  notify:
    needs: ["lint", "unit-tests", "functional-tests", "e2e-tests"]
    if: always()
    name: "Notification"
    runs-on: ubuntu-latest
    steps:
      - name: "Status notification"
        run: |
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.functional-tests.result }}" == "success" ] && \
             [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "Tous les tests sont passés avec succès"
          else
            echo "Échec des tests:"
            echo "  unit-tests: ${{ needs.unit-tests.result }}"
            echo "  functional-tests: ${{ needs.functional-tests.result }}"
            echo "  e2e-tests: ${{ needs.e2e-tests.result }}"
            exit 1
          fi
