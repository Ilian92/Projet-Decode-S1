name: "CD - Deploy to Raspberry Pi"

on:
    workflow_dispatch:
    push:
        branches:
            - dev

jobs:
    prepare:
        name: "Prepare project"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: "Show variables"
              run: |
                  echo "OS: $RUNNER_OS"
                  echo "ARCH: $RUNNER_ARCH"
                  echo "RPI_HOST: ${{ secrets.RPI_HOST }}"
                  echo "RPI_USER: ${{ secrets.RPI_USER }}"

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: projet-s1-symfony/vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-prod

            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      projet-s1-symfony/node_modules
                      ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-prod

            - name: Install Composer dependencies
              working-directory: projet-s1-symfony
              env:
                  APP_ENV: prod
                  APP_DEBUG: "0"
              run: composer install --no-dev --optimize-autoloader --no-interaction

            - name: Install npm dependencies
              working-directory: projet-s1-symfony
              run: npm ci

    build:
        needs: ["prepare"]
        name: "Build assets"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Restore Composer cache
              uses: actions/cache/restore@v4
              with:
                  path: projet-s1-symfony/vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-prod

            - name: Restore npm cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      projet-s1-symfony/node_modules
                      ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-prod

            - name: Build assets
              working-directory: projet-s1-symfony
              run: npm run build

    deploy:
        needs: ["build"]
        name: "Deploy to Raspberry Pi"
        runs-on: ubuntu-latest
        steps:
            - name: "Install SSH CONFIG"
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RPI_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -6 -H "${{ secrets.RPI_HOST }}" >> ~/.ssh/known_hosts || true

            - name: "Git pull on Raspberry Pi"
              run: |
                  ssh -o StrictHostKeyChecking=no ${{ secrets.RPI_USER }}@[${{ secrets.RPI_HOST }}] 'bash -s' << 'EOF'
                  set -euo pipefail

                  PROJECT_DIR="/home/ilian/Dev/Projet-Decode-S1"
                  if [ ! -d "$PROJECT_DIR/.git" ]; then
                    echo "❌ Repo non trouvé sur le Raspberry Pi: $PROJECT_DIR/.git"
                    echo "➡️ Clonez d'abord le repo sur le Pi dans $PROJECT_DIR (ou adaptez PROJECT_DIR dans le workflow)."
                    exit 1
                  fi

                  cd "$PROJECT_DIR"
                  echo "🔄 Mise à jour du code depuis origin/dev..."
                  git fetch origin dev
                  git reset --hard origin/dev
                  EOF

            - name: "Post-deployment tasks"
              run: |
                  ssh -o StrictHostKeyChecking=no ${{ secrets.RPI_USER }}@[${{ secrets.RPI_HOST }}] 'bash -s' << 'EOF'
                  set -euo pipefail

                  cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

                  export APP_ENV=prod
                  export APP_DEBUG=0

                  echo "Installation des dépendances PHP..."
                  composer install --no-dev --optimize-autoloader --no-interaction

                  echo "Installation des dépendances Node.js..."
                  npm ci

                  echo "Build des assets..."
                  npm run build

                  # Backup de la base de données
                  echo "Backup de la base de données..."
                  timestamp=$(date +%d.%m.%Y-%H.%M.%S)
                  mkdir -p ~/backups/db
                  php bin/console doctrine:schema:update --dump-sql > ~/backups/db/schema-$timestamp.sql

                  # Garder seulement les 5 derniers backups SQL
                  cd ~/backups/db
                  ls -t schema-*.sql | tail -n +6 | xargs -r rm

                  # Retour au projet
                  cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

                  # Migrations de la base de données
                  echo "Exécution des migrations..."
                  php bin/console doctrine:migrations:migrate --no-interaction --env=prod

                  # Clear le cache
                  echo "Nettoyage du cache..."
                  php bin/console cache:clear --env=prod
                  php bin/console cache:warmup --env=prod

                  # Permissions
                  echo "Ajustement des permissions..."
                  chmod -R 775 var/cache var/log

                  echo "Déploiement terminé avec succès!"
                  EOF

    monitoring:
        needs: ["deploy"]
        name: "Monitoring"
        runs-on: ubuntu-latest
        steps:
            - name: "Install SSH CONFIG"
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.RPI_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -6 -H "${{ secrets.RPI_HOST }}" >> ~/.ssh/known_hosts || true

            - name: "Check deployment status"
              run: |
                  ssh -o StrictHostKeyChecking=no ${{ secrets.RPI_USER }}@[${{ secrets.RPI_HOST }}] 'bash -s' << 'EOF'
                  cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

                  export APP_ENV=prod
                  export APP_DEBUG=0

                  echo "Vérification de la version PHP..."
                  php -v

                  echo "Vérification des migrations..."
                  php bin/console doctrine:migrations:status --env=prod

                  echo "Vérification du cache..."
                  ls -lah var/cache

                  echo "Monitoring terminé"
                  EOF

    notify:
        needs: ["monitoring"]
        if: always()
        name: "Notification"
        runs-on: ubuntu-latest
        steps:
            - name: "Status notification"
              run: |
                  if [ "${{ needs.deploy.result }}" == "success" ]; then
                    echo "Déploiement réussi sur Raspberry Pi (${{ secrets.RPI_HOST }})"
                  else
                    echo "Échec du déploiement"
                  fi
