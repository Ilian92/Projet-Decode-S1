name: "CD - Deploy to Raspberry Pi"

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  prepare:
    name: "Prepare project"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Show variables"
        run: |
          echo "OS: $RUNNER_OS"
          echo "ARCH: $RUNNER_ARCH"
          echo "RPI_HOST: ${{ secrets.RPI_HOST }}"
          echo "RPI_USER: ${{ secrets.RPI_USER }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: projet-s1-symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-prod

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            projet-s1-symfony/node_modules
            simple-agent/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-prod

      - name: Create .env.local
        working-directory: projet-s1-symfony
        run: |
          cat > .env.local << EOF
          APP_ENV=prod
          APP_DEBUG=0
          APP_SECRET=${{ secrets.APP_SECRET }}
          DEFAULT_URI=${{ secrets.DEFAULT_URI }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          EOF

      - name: Install Composer dependencies
        working-directory: projet-s1-symfony
        env:
          APP_ENV: prod
          APP_DEBUG: "0"
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Install npm dependencies
        working-directory: projet-s1-symfony
        run: npm ci

      - name: Install simple-agent npm dependencies
        working-directory: simple-agent
        run: npm ci --legacy-peer-deps

  build:
    needs: ["prepare"]
    name: "Build assets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore Composer cache
        uses: actions/cache/restore@v4
        with:
          path: projet-s1-symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-prod

      - name: Restore npm cache
        uses: actions/cache/restore@v4
        with:
          path: |
            projet-s1-symfony/node_modules
            simple-agent/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-prod

      - name: Build assets
        working-directory: projet-s1-symfony
        run: npm run build

  deploy:
    needs: ["build"]
    name: "Deploy to Raspberry Pi"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Connect runner to Tailscale"
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: "Install SSH CONFIG"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          echo "${{ secrets.PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/config

      - name: "Fix permissions before rsync"
        run: |
          ssh rpi 'bash -s' << 'EOF'
          echo "Correction des permissions avant rsync..."
          sudo chown -R ilian:ilian /home/ilian/Dev/Projet-Decode-S1 2>/dev/null || true
          EOF

      - name: deploy sources to remote server
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avzr --delete --exclude .git --exclude .github --exclude tests
          path: ./
          remote_path: /home/ilian/Dev/Projet-Decode-S1
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.PRIVATE_KEY }}
          remote_port: ${{ secrets.REMOTE_PORT }}

      - name: "Post-deployment tasks"
        run: |
          ssh rpi 'bash -s' << 'EOF'
          set -euo pipefail

          cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

          echo "Correction des permissions après rsync..."
          sudo chown -R ilian:ilian .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod +x bin/console

          echo "Démarrage des services Docker (PostgreSQL, Mailpit, Webapp)..."
          command -v docker >/dev/null 2>&1 || { echo "Docker n'est pas installé sur le Pi"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "docker compose n'est pas disponible sur le Pi"; exit 1; }

          # Arrêter webapp temporairement pour éviter les conflits de permissions
          docker compose stop webapp 2>/dev/null || true

          # Démarrer uniquement database et mailer
          docker compose up -d database mailer

          echo "Correction des permissions des fichiers créés par Docker..."
          sudo chown -R ilian:ilian . 2>/dev/null || true

          echo "Attente que PostgreSQL soit prêt..."
          until docker exec $(docker ps -qf "name=database") pg_isready -U "${POSTGRES_USER:-app}" -d "${POSTGRES_DB:-app}"; do
              echo "PostgreSQL n'est pas encore prêt, attente de 5 secondes..."
              sleep 3
          done

          export APP_ENV=prod
          export APP_DEBUG=0

          echo "Création du fichier .env.local..."
          printf 'APP_ENV=prod\nAPP_DEBUG=0\nAPP_SECRET=${{ secrets.APP_SECRET }}\nDEFAULT_URI=${{ secrets.DEFAULT_URI }}\nDATABASE_URL=${{ secrets.DATABASE_URL }}\nMAILER_DSN=${{ secrets.MAILER_DSN }}\nSTRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}\n' > .env.local
          chmod 600 .env.local

          echo "Installation des dépendances PHP..."
          sudo apt-get update
          sudo apt-get install -y php-xml php-pgsql composer

          # Supprimer vendor/ pour éviter les conflits de permissions
          sudo rm -rf vendor/
          composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

          echo "Installation des dépendances Node.js..."
          sudo apt install nodejs npm -y
          npm ci

          echo "Build des assets..."
          npm run build

          # Retour au projet
          cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

          # Reconstruction de l'image Docker avec les nouvelles dépendances
          echo "Reconstruction de l'image Docker..."
          docker compose build webapp

          # Lancement du service webapp
          docker compose up -d webapp

          # Attendre que webapp soit prêt
          sleep 5

          # Migrations de la base de données (dans le conteneur)
          echo "Exécution des migrations..."
          docker compose exec -T webapp php bin/console doctrine:migrations:migrate --no-interaction --env=prod

          # Clear le cache (dans le conteneur)
          echo "Nettoyage du cache..."
          docker compose exec -T webapp php bin/console cache:clear --env=prod
          docker compose exec -T webapp php bin/console cache:warmup --env=prod

          # Permissions
          echo "Ajustement des permissions..."
          sudo chown -R ilian:ilian var/ 2>/dev/null || true
          mkdir -p var/cache var/log
          chmod -R 775 var/cache var/log

          echo "Installation des dépendances simple-agent..."
          cd "/home/ilian/Dev/Projet-Decode-S1/simple-agent"
          npm ci --legacy-peer-deps

          echo "Démarrage/redémarrage de simple-agent avec pm2..."
          command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2 --unsafe-perm
          pm2 restart simple-agent 2>/dev/null || pm2 start "npm run server" --name simple-agent
          pm2 save

          cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"
          echo "Déploiement terminé avec succès!"
          EOF

      - name: "Start n8n and Cloudflare tunnel"
        run: |
          ssh rpi 'bash -s' << 'EOF'
          set -euo pipefail

          echo "Démarrage/redémarrage de n8n..."
          docker stop n8n 2>/dev/null || true
          docker rm n8n 2>/dev/null || true
          docker run -d \
            --name n8n \
            --restart unless-stopped \
            -p 8001:5678 \
            -e GENERIC_TIMEZONE="Europe/Paris" \
            -e TZ="Europe/Paris" \
            -e N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
            -e N8N_RUNNERS_ENABLED=true \
            -e WEBHOOK_URL="https://ilian-igoudjil.decode.school" \
            -e N8N_HOST="ilian-igoudjil.decode.school" \
            -e N8N_PORT="5678" \
            -e N8N_PROTOCOL="https" \
            -e N8N_SECURE_COOKIE="false" \
            -v n8n_data:/home/node/.n8n \
            docker.n8n.io/n8nio/n8n

          echo "Vérification que n8n est démarré..."
          sleep 5
          docker ps | grep n8n && echo "n8n démarré avec succès" || echo "ERREUR: n8n non démarré"

          echo "Démarrage/redémarrage du tunnel Cloudflare..."
          command -v cloudflared >/dev/null 2>&1 || (
            curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 -o /tmp/cloudflared
            sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          )
          command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2 --unsafe-perm
          pm2 restart cloudflare-tunnel 2>/dev/null || pm2 start "cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" --name cloudflare-tunnel
          pm2 save

          echo "Services démarrés avec succès!"
          EOF

  monitoring:
    needs: ["deploy"]
    name: "Monitoring"
    runs-on: ubuntu-latest
    steps:
      - name: "Connect runner to Tailscale"
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: "Install SSH CONFIG"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          echo "${{ secrets.PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/config

      - name: "Check deployment status"
        run: |
          ssh rpi 'bash -s' << 'EOF'
          cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

          export APP_ENV=prod
          export APP_DEBUG=0

          echo "Vérification de la version PHP..."
          docker compose exec -T webapp php -v

          echo "Vérification des migrations..."
          docker compose exec -T webapp php bin/console doctrine:migrations:status --env=prod

          echo "Vérification du cache..."
          docker compose exec -T webapp ls -lah var/cache

          echo "Monitoring terminé"
          EOF

  notify:
    needs: ["deploy", "monitoring"]
    if: always()
    name: "Notification"
    runs-on: ubuntu-latest
    steps:
      - name: "Status notification"
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Déploiement réussi sur Raspberry Pi (${{ secrets.REMOTE_HOST }})"
          else
            echo "Échec du déploiement"
          fi
