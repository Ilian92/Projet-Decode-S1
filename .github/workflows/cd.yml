name: "CD - Deploy to Raspberry Pi"

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  prepare:
    name: "Prepare project"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Show variables"
        run: |
          echo "OS: $RUNNER_OS"
          echo "ARCH: $RUNNER_ARCH"
          echo "RPI_HOST: ${{ secrets.RPI_HOST }}" 
          echo "RPI_USER: ${{ secrets.RPI_USER }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: projet-s1-symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-prod

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            projet-s1-symfony/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-prod

      - name: Install Composer dependencies
        working-directory: projet-s1-symfony
        env:
          APP_ENV: prod
          APP_DEBUG: "0"
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install npm dependencies
        working-directory: projet-s1-symfony
        run: npm ci

  build:
    needs: ["prepare"]
    name: "Build assets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore Composer cache
        uses: actions/cache/restore@v4
        with:
          path: projet-s1-symfony/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-prod

      - name: Restore npm cache
        uses: actions/cache/restore@v4
        with:
          path: |
            projet-s1-symfony/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-prod

      - name: Build assets
        working-directory: projet-s1-symfony
        run: npm run build

  deploy:
    needs: ["build"]
    name: "Deploy to Raspberry Pi"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Connect runner to Tailscale"
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: "Install SSH CONFIG"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          echo "${{ secrets.PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/config

      - name: deploy sources to remote server
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avzr --delete --exclude .git --exclude .github --exclude tests
          path: ./
          remote_path: /home/ilian/Dev/Projet-Decode-S1
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.PRIVATE_KEY }}
          remote_port: ${{ secrets.REMOTE_PORT }}

      - name: "Post-deployment tasks"
        run: |
          ssh rpi 'bash -s' << 'EOF'
          set -euo pipefail

          PROJECT_DIR="/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"
          COMPOSE_ROOT="/home/ilian/Dev"

          cd "$PROJECT_DIR"

          echo "Vérification de Docker..."
          command -v docker >/dev/null 2>&1 || { echo "Docker n'est pas installé sur le Pi"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "docker compose n'est pas disponible sur le Pi"; exit 1; }

          # Redémarrer les services depuis le compose principal pour éviter les conflits
          echo "Redémarrage des services du projet Symfony depuis le compose principal..."
          cd "$COMPOSE_ROOT"
          if [ -f "compose.yaml" ] || [ -f "docker-compose.yaml" ]; then
              # Redémarrer uniquement les services du projet Symfony
              docker compose restart database webapp mailer 2>/dev/null || true
              docker compose up -d database webapp mailer 2>/dev/null || docker compose up -d
          else
              # Fallback : démarrer depuis le dossier du projet si pas de compose principal
              cd "$PROJECT_DIR"
              docker compose up -d
          fi

          echo "Attente que PostgreSQL soit prêt..."
          # Utiliser un nom de conteneur plus robuste
          DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep -E '(database|postgres)' | head -n 1)
          if [ -z "$DB_CONTAINER" ]; then
              echo "Erreur: Conteneur PostgreSQL introuvable"
              exit 1
          fi

          echo "Conteneur PostgreSQL trouvé: $DB_CONTAINER"
          until docker exec "$DB_CONTAINER" pg_isready -U "${POSTGRES_USER:-app}" -d "${POSTGRES_DB:-app}" 2>/dev/null; do
              echo "PostgreSQL n'est pas encore prêt, attente de 3 secondes..."
              sleep 3
          done

          cd "$PROJECT_DIR" 

          export APP_ENV=prod
          export APP_DEBUG=0

          echo "Installation des dépendances PHP..."
          sudo apt-get update
          sudo apt-get install -y php-xml php-pgsql composer
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "Installation des dépendances Node.js..."
          sudo apt install nodejs npm -y
          npm ci

          echo "Build des assets..."
          npm run build

          # Retour au projet
          cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

          # Migrations de la base de données
          echo "Exécution des migrations..."
          php bin/console doctrine:migrations:migrate --no-interaction --env=prod

          # Clear le cache
          echo "Nettoyage du cache..."
          php bin/console cache:clear --env=prod
          php bin/console cache:warmup --env=prod

          # Permissions
          echo "Ajustement des permissions..."
          mkdir -p var/cache var/log
          chmod -R 775 var/cache var/log

          echo "Déploiement terminé avec succès!"
          EOF

  monitoring:
    needs: ["deploy"]
    name: "Monitoring"
    runs-on: ubuntu-latest
    steps:
      - name: "Connect runner to Tailscale"
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: "Install SSH CONFIG"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          echo "${{ secrets.PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/config

      - name: "Check deployment status"
        run: |
          ssh rpi 'bash -s' << 'EOF'
          cd "/home/ilian/Dev/Projet-Decode-S1/projet-s1-symfony"

          export APP_ENV=prod
          export APP_DEBUG=0

          echo "Vérification de la version PHP..."
          php -v

          echo "Vérification des migrations..."
          php bin/console doctrine:migrations:status --env=prod

          echo "Vérification du cache..."
          ls -lah var/cache

          echo "Monitoring terminé"
          EOF

  notify:
    needs: ["deploy", "monitoring"]
    if: always()
    name: "Notification"
    runs-on: ubuntu-latest
    steps:
      - name: "Status notification"
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Déploiement réussi sur Raspberry Pi (${{ secrets.REMOTE_HOST }})"
          else
            echo "Échec du déploiement"
          fi
